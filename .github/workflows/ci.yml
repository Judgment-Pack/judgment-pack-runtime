name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# `check` sets the toolchains up from the manifest and runs the steps: on a pull request the steps
# jpdev.json maps the changed paths to (`check.sh --changed`), on a push to main the whole list.
# `test` is the operating system and Go version matrix: its legs run the Go steps of dev.json
# natively on each platform. The macOS leg runs on a push to main, on the nightly schedule and when
# the release workflow calls this one before it drafts a release, not on a pull request; the other
# legs' job names are required by branch protection.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: [stable]
        include:
          - os: ubuntu-latest
            # The floor in go.mod. os.Root, which internal/fssecure binds every
            # project read to, is a Go 1.24 standard-library type.
            go: 1.24.x
        # macOS runners are the slowest to start: a pull request (or a merge queue entry) runs
        # without that leg. An exclude that matches nothing removes nothing.
        exclude:
          - os: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'macos-latest' || 'none' }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: go fmt ./...
      # startup/ is a nested module (ADR-0096): `./...` at the root does not enter it, so it has
      # steps of its own. Its coverage floor is the check job's startup-test step.
      - name: Check formatting of the start-up module
        working-directory: startup
        run: go fmt ./...
      - name: Verify formatting did not change files
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Vet the start-up module
        working-directory: startup
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Test the start-up module
        working-directory: startup
        run: go test -cover ./...
      # cmd/jpack-emit-go-loader/golden/ is a nested module too (ADR-0102): the loader emitter's
      # expected files import the start-up module, which the root module does not require.
      - name: Vet the loader emitter's golden module
        working-directory: cmd/jpack-emit-go-loader/golden
        run: go vet ./...
      - name: Test the loader emitter's golden module
        working-directory: cmd/jpack-emit-go-loader/golden
        run: go test ./...
      - name: Run bundled conformance suite
        run: go run ./cmd/jpack spec test-conformance --quiet
      - name: Build
        run: go build -trimpath ./cmd/jpack
        env:
          CGO_ENABLED: "0"
      - name: Check audit line formats
        run: go run ./tools/audit-formats

  check:
    name: check
    # The nightly run is for the test matrix's macOS leg; main's pushes already run the whole list.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      # Includes the MCP registry server.json template check (scripts/check-registry-template.py).
      # A pull request runs the steps jpdev.json maps its changed paths to, and the whole list when
      # a path is unmapped or the mapping, dev.json or the runner changed. A push to main runs the
      # whole list, and only that run is what a release is held to.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF"
          else
            scripts/dev/check.sh --all
          fi
