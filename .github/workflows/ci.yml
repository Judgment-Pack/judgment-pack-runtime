name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: ubuntu-latest
            # The floor in go.mod. os.Root, which internal/fssecure binds every
            # project read to, is a Go 1.24 standard-library type.
            go: 1.24.x
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: go fmt ./...
      - name: Verify formatting did not change files
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Run bundled conformance suite
        run: go run ./cmd/judgment-pack spec test-conformance --quiet
      - name: Build
        run: go build -trimpath ./cmd/judgment-pack
        env:
          CGO_ENABLED: "0"

  registry-template:
    name: MCP registry server.json template
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate rendered template against the vendored schema
        shell: bash
        # The schema copy is the one the release workflow's pinned mcp-publisher
        # enforces; bump both together (ADR-0013).
        run: |
          pip3 install --quiet jsonschema==4.23.0
          sed 's/__VERSION__/9.9.9-rc.1/g' build/mcp-registry/server.json.tmpl > /tmp/server.json
          python3 - <<'EOF'
          import json, jsonschema, sys
          schema = json.load(open('build/mcp-registry/server.schema-2025-12-11.json'))
          doc = json.load(open('/tmp/server.json'))
          errors = [
              '/'.join(map(str, e.path)) + ' - ' + e.message
              for e in jsonschema.Draft202012Validator(schema).iter_errors(doc)
          ]
          # Server-side rules the registry enforces beyond its schema, learned
          # from live rejections (v0.5.0-rc.1): an OCI package carries its
          # version in the identifier tag and must not have a version member.
          for i, package in enumerate(doc.get('packages', [])):
              if package.get('registryType') == 'oci':
                  if 'version' in package:
                      errors.append(f'packages/{i} - OCI packages must not have a version member')
                  if ':' not in package.get('identifier', ''):
                      errors.append(f'packages/{i} - OCI identifier must carry the version as its tag')
          for e in errors:
              print('INVALID:', e, file=sys.stderr)
          sys.exit(1 if errors else 0)
          EOF
