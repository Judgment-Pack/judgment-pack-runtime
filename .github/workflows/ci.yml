name: CI

# The check list is dev.json, run by scripts/dev/check.sh (the development kit's vendored runner).
# `check` sets the toolchains up from the manifest and runs the steps: on a pull request the steps
# jpdev.json maps the changed paths to (`check.sh --changed`), on a push to main the whole list.
# `test` is the operating system and Go version matrix: its job names are required by branch
# protection, and its legs run the Go steps of dev.json natively on each platform.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} · Go ${{ matrix.go }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go: stable
          - os: ubuntu-latest
            # The floor in go.mod. os.Root, which internal/fssecure binds every
            # project read to, is a Go 1.24 standard-library type.
            go: 1.24.x
          - os: macos-latest
            go: stable
          - os: windows-latest
            go: stable
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Check formatting
        run: go fmt ./...
      - name: Verify formatting did not change files
        run: git diff --exit-code
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Run bundled conformance suite
        run: go run ./cmd/jpack spec test-conformance --quiet
      - name: Build
        run: go build -trimpath ./cmd/jpack
        env:
          CGO_ENABLED: "0"
      - name: Check audit line formats
        run: go run ./tools/audit-formats

  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # The whole history, so that --changed finds the merge base with the base branch.
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # First, so that a manifest that does not parse fails before the long steps start.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: true
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Setup steps
        run: scripts/dev/check.sh --setup
      # Includes the MCP registry server.json template check (scripts/check-registry-template.py).
      # A pull request runs the steps jpdev.json maps its changed paths to, and the whole list when
      # a path is unmapped or the mapping, dev.json or the runner changed. A push to main runs the
      # whole list, and only that run is what a release is held to.
      - name: Checks
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/dev/check.sh --all --changed "origin/$BASE_REF"
          else
            scripts/dev/check.sh --all
          fi
